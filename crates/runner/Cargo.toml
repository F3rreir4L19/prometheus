[package]
name = "runner"
version.workspace = true
edition.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
domain.workspace = true
governor = { version = "=0.10.4", default-features = false, features = ["std"] }
httpdate = "=1.0.3"
intel = { path = "../intel" }
reqwest = { version = "=0.12.28", default-features = false, features = ["rustls-tls"] }
scope-engine.workspace = true
serde.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["sync", "time"] }
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
rustix = { version = "=1.1.6", features = ["fs"] }
sha2.workspace = true
tempfile = "=3.27.0"
tokio = { workspace = true, features = ["io-util", "process", "sync", "time"] }

[dev-dependencies]
axum = { workspace = true, features = ["http1", "tokio"] }
serde_yaml.workspace = true
tokio = { workspace = true, features = ["net", "test-util"] }
